# LIFE-555 설치본 패키징 (446 T1) — `npm run package:mac` → dist/ 에 arm64 dmg·zip.
# bundle id 는 이후 바꾸지 않는다: 알림 권한·T4 업데이트가 이 값에 묶인다(근거 specs/LIFE-555-app-packaging/raw/claude/RESULT.md).
appId: io.github.byun618.corral
# 앱 이름·실행 파일·userData 모두 소문자 `corral` — CLI `defaultUserData()` 하드코딩과 같은 문자열(F7)
productName: corral
executableName: corral
directories:
  output: dist
  buildResources: build
files:
  - package.json
  - out/**
  - cli/**
  - '!out/**/*.map'
# CLI 는 asar 밖에 둔다 — shim 이 Node 모드로 직접 실행하고, CLI 는 자기 위치(app.asar.unpacked)로 설치본임을 안다
asarUnpack:
  - out/runtime/**
  - cli/**
extraResources:
  - from: build/bin/corral
    to: bin/corral
  # LIFE-556 — 동봉 herdr(release 패치)와 Apache-2.0 고지. `bin/` 과 다른 폴더라 shim 폴더를 PATH 에 올려도 herdr 는 풀리지 않는다.
  # `npm run package:mac` 이 `scripts/bundle-herdr.mjs` 로 검증해 놓는다(없으면 패키징 전에 멈춘다).
  - from: build/backend/herdr
    to: backend/herdr
  - from: build/backend/LICENSE-herdr
    to: backend/LICENSE-herdr
  - from: build/backend/NOTICE-herdr.md
    to: backend/NOTICE-herdr.md
  - from: build/backend/herdr.json
    to: backend/herdr.json
  # LIFE-676 — Resource Manager 메모리 도우미(phys_footprint 표). 소스 `helper/corral-footprint.c`, `npm run build` 가 빌드하고
  # `package:mac` 이 electron-builder 직전에 `build-footprint.mjs --check` 로 확인한다(없으면 패키징 전에 멈춘다).
  - from: build/helper/corral-footprint
    to: helper/corral-footprint
  # LIFE-589 — 탐색기 아이콘 글꼴 고지. 글꼴 자체는 렌더러 번들(asar)에 든다: Seti(vscode 1.142.0, MIT + 제3자 고지) · codicons(CC BY 4.0 / 코드 MIT).
  - from: src/renderer/src/assets/seti/VSCODE-LICENSE.txt
    to: licenses/seti/VSCODE-LICENSE.txt
  - from: src/renderer/src/assets/seti/ThirdPartyNotices.txt
    to: licenses/seti/ThirdPartyNotices.txt
  - from: src/renderer/src/assets/codicons/LICENSE
    to: licenses/codicons/LICENSE
  - from: src/renderer/src/assets/codicons/LICENSE-CODE
    to: licenses/codicons/LICENSE-CODE
  # LIFE-572 — 편집기 TextMate 문법·테마 고지(LIFE-590 반입, vscode MIT + 문법별 원저작 cgmanifest). 문법·테마 자체는 렌더러 번들에 든다.
  - from: src/renderer/src/assets/textmate/notices
    to: licenses/textmate
# 렌더러·main 번들 외 네이티브 모듈 없음
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  icon: build/icon.png
  # 서명 방식 결정(D1)은 T4 전 재결정 — T1 은 ad-hoc. arm64 는 서명이 없으면 열리지 않는다
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  writeUpdateInfo: false
publish: null
